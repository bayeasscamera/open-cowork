name: Codex PR Review

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize, labeled]

permissions: {}

concurrency:
  group: codex-pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-review:
    if: |
      github.event.pull_request.draft == false &&
      !endsWith(github.actor, '[bot]') &&
      !contains(github.event.pull_request.labels.*.name, 'bot-skip')
    timeout-minutes: 20
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      should_publish: ${{ steps.validate_review.outputs.should_publish }}

    steps:
      - name: Check bot review state
        id: check_bot
        uses: actions/github-script@v9
        with:
          script: |
            const marker = "*Open Cowork Bot*";
            const allowedLogins = (process.env.BOT_LOGINS || "github-actions[bot]")
              .split(",")
              .map((value) => value.trim())
              .filter(Boolean);
            const currentHeadSha = context.payload.pull_request.head.sha;
            const reviews = await github.paginate(
              github.rest.pulls.listReviews,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.pull_request.number,
                per_page: 100
              }
            );
            const botReviews = reviews
              .filter((review) => {
                if (!(review?.body || "").includes(marker)) {
                  return false;
                }
                const user = review.user;
                if (!user || user.type !== "Bot") {
                  return false;
                }
                return allowedLogins.includes(user.login);
              })
              .sort((left, right) => {
                const leftTime = new Date(left.submitted_at || left.created_at || 0).getTime();
                const rightTime = new Date(right.submitted_at || right.created_at || 0).getTime();
                if (rightTime !== leftTime) {
                  return rightTime - leftTime;
                }
                return (right.id || 0) - (left.id || 0);
            });
            const latestBotReview = botReviews[0];
            // Only the latest bot review can suppress a new run. If history was
            // rolled back to an older, previously reviewed SHA, a newer review
            // may now be stale and must be superseded by a fresh full review.
            const hasReviewForCurrentHead =
              latestBotReview?.commit_id === currentHeadSha;
            let isFollowUpReview = false;
            let priorContextDiscarded = false;
            const previousHeadSha = latestBotReview?.commit_id;

            // Reuse an earlier review only when the current head is a linear
            // extension of the reviewed commit. Comparing diverged heads after a
            // force-push/rebase mixes newly merged base-branch changes into the
            // "since previous review" diff and produces stale findings.
            if (previousHeadSha && previousHeadSha !== currentHeadSha) {
              try {
                const comparison = await github.request(
                  "GET /repos/{owner}/{repo}/compare/{basehead}",
                  {
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    basehead: `${previousHeadSha}...${currentHeadSha}`
                  }
                );
                const mergeBaseSha = comparison.data.merge_base_commit?.sha;
                const comparedCommits = comparison.data.commits || [];
                const hasCompleteCommitList =
                  comparison.data.ahead_by === comparedCommits.length;
                const hasMergeCommit = comparedCommits.some(
                  (commit) => (commit.parents?.length || 0) > 1
                );
                isFollowUpReview =
                  comparison.data.status === "ahead" &&
                  comparison.data.behind_by === 0 &&
                  mergeBaseSha === previousHeadSha &&
                  hasCompleteCommitList &&
                  !hasMergeCommit;
                priorContextDiscarded = !isFollowUpReview;
                if (priorContextDiscarded) {
                  core.notice(
                    `PR history is not a linear extension of ${previousHeadSha}; ` +
                    "discarding prior review context and running a fresh full review."
                  );
                }
              } catch (error) {
                priorContextDiscarded = true;
                core.warning(
                  `Could not verify prior review ancestry (${error.message}); ` +
                  "discarding prior context and running a fresh full review."
                );
              }
            }

            core.setOutput("current_head_sha", currentHeadSha);
            core.setOutput("has_review_for_current_head", hasReviewForCurrentHead ? "true" : "false");
            core.setOutput(
              "latest_bot_review_id",
              isFollowUpReview && latestBotReview ? String(latestBotReview.id) : ""
            );
            core.setOutput(
              "latest_bot_review_commit",
              isFollowUpReview ? latestBotReview?.commit_id || "" : ""
            );
            core.setOutput("is_follow_up_review", isFollowUpReview ? "true" : "false");
            core.setOutput(
              "prior_context_discarded",
              priorContextDiscarded ? "true" : "false"
            );
        env:
          BOT_LOGINS: ${{ vars.BOT_LOGINS }}

      - name: Checkout repository
        if: steps.check_bot.outputs.has_review_for_current_head != 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Pre-fetch PR head without persisting credentials
        if: steps.check_bot.outputs.has_review_for_current_head != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' fetch --no-tags origin \
            "+refs/pull/${PR_NUMBER}/head:refs/remotes/pull/${PR_NUMBER}/head"

      - name: Resolve review provider config
        if: steps.check_bot.outputs.has_review_for_current_head != 'true'
        id: review_config
        shell: bash
        env:
          DEFAULT_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEFAULT_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          DEFAULT_MODEL: ${{ vars.OPENAI_MODEL }}
          DEFAULT_EFFORT: ${{ vars.OPENAI_EFFORT }}
          REVIEW_API_KEY: ${{ secrets.REVIEW_OPENAI_API_KEY }}
          REVIEW_BASE_URL: ${{ secrets.REVIEW_OPENAI_BASE_URL }}
          REVIEW_MODEL: ${{ vars.REVIEW_OPENAI_MODEL }}
          REVIEW_EFFORT: ${{ vars.REVIEW_OPENAI_EFFORT }}
        run: |
          api_key="$REVIEW_API_KEY"
          [ -n "$api_key" ] || api_key="$DEFAULT_API_KEY"

          base_url="$REVIEW_BASE_URL"
          [ -n "$base_url" ] || base_url="$DEFAULT_BASE_URL"

          model="$REVIEW_MODEL"
          [ -n "$model" ] || model="$DEFAULT_MODEL"
          [ -n "$model" ] || model='gpt-5.4'

          effort="$REVIEW_EFFORT"
          [ -n "$effort" ] || effort="$DEFAULT_EFFORT"
          [ -n "$effort" ] || effort='high'

          is_deepseek='false'
          case "$base_url" in
            *api.deepseek.com*)
              is_deepseek='true'
              ;;
          esac

          {
            echo "api_key=$api_key"
            echo "base_url=$base_url"
            echo "model=$model"
            echo "effort=$effort"
            echo "is_deepseek=$is_deepseek"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Node.js for DeepSeek review
        if: steps.check_bot.outputs.has_review_for_current_head != 'true' && steps.review_config.outputs.is_deepseek == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'

      - name: Run DeepSeek for PR Review
        if: steps.check_bot.outputs.has_review_for_current_head != 'true' && steps.review_config.outputs.is_deepseek == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_HEAD_SHA: ${{ steps.check_bot.outputs.current_head_sha }}
          LATEST_BOT_REVIEW_ID: ${{ steps.check_bot.outputs.latest_bot_review_id }}
          LATEST_BOT_REVIEW_COMMIT: ${{ steps.check_bot.outputs.latest_bot_review_commit }}
          IS_FOLLOW_UP_REVIEW: ${{ steps.check_bot.outputs.is_follow_up_review }}
          PRIOR_CONTEXT_DISCARDED: ${{ steps.check_bot.outputs.prior_context_discarded }}
          REVIEW_OUTPUT_PATH: ${{ runner.temp }}/pr-review.json
          DEEPSEEK_API_KEY: ${{ steps.review_config.outputs.api_key }}
          DEEPSEEK_BASE_URL: ${{ steps.review_config.outputs.base_url }}
          DEEPSEEK_MODEL: ${{ steps.review_config.outputs.model }}
          DEEPSEEK_EFFORT: ${{ steps.review_config.outputs.effort }}
        run: node .github/scripts/deepseek-pr-review.mjs

      - name: Run Codex for PR Review
        id: run_codex
        if: steps.check_bot.outputs.has_review_for_current_head != 'true' && steps.review_config.outputs.is_deepseek != 'true'
        uses: openai/codex-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_HEAD_SHA: ${{ steps.check_bot.outputs.current_head_sha }}
          LATEST_BOT_REVIEW_ID: ${{ steps.check_bot.outputs.latest_bot_review_id }}
          LATEST_BOT_REVIEW_COMMIT: ${{ steps.check_bot.outputs.latest_bot_review_commit }}
          IS_FOLLOW_UP_REVIEW: ${{ steps.check_bot.outputs.is_follow_up_review }}
          PRIOR_CONTEXT_DISCARDED: ${{ steps.check_bot.outputs.prior_context_discarded }}
        with:
          openai-api-key: ${{ steps.review_config.outputs.api_key }}
          responses-api-endpoint: ${{ steps.review_config.outputs.base_url }}
          model: ${{ steps.review_config.outputs.model }}
          effort: ${{ steps.review_config.outputs.effort }}
          sandbox: read-only
          output-file: ${{ runner.temp }}/pr-review.json
          safety-strategy: drop-sudo
          prompt-file: .github/prompts/codex-pr-review.md
          allow-bots: true
          allow-users: '*'

      - name: Validate analysis output
        id: validate_review
        if: success() && steps.check_bot.outputs.has_review_for_current_head != 'true'
        env:
          REVIEW_OUTPUT_PATH: ${{ runner.temp }}/pr-review.json
        run: |
          node -e 'const fs = require("node:fs"); const { validateReview } = require("./.github/scripts/pr-review-output.cjs"); validateReview(fs.readFileSync(process.env.REVIEW_OUTPUT_PATH, "utf8"));'
          printf 'should_publish=true\n' >> "$GITHUB_OUTPUT"

      - name: Upload validated analysis
        if: success() && steps.validate_review.outputs.should_publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pr-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pr-review.json
          if-no-files-found: error
          retention-days: 1

  publish-review:
    needs: pr-review
    if: needs.pr-review.result == 'success' && needs.pr-review.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout trusted publisher
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Download analysis from this run
        uses: actions/download-artifact@v4
        with:
          name: pr-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/review-output

      - name: Publish advisory review
        uses: actions/github-script@v9
        env:
          REVIEW_OUTPUT_PATH: ${{ runner.temp }}/review-output/pr-review.json
          ANALYSIS_RESULT: ${{ needs.pr-review.result }}
          SHOULD_PUBLISH: ${{ needs.pr-review.outputs.should_publish }}
        with:
          script: |
            const fs = require('node:fs');
            const { publishReview } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/pr-review-output.cjs`);
            const raw = fs.readFileSync(process.env.REVIEW_OUTPUT_PATH, 'utf8');
            await publishReview({ github, context, raw,
              analysisResult: process.env.ANALYSIS_RESULT,
              shouldPublish: process.env.SHOULD_PUBLISH });
