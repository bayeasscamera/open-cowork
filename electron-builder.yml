appId: com.opencowork.app
productName: Open Cowork
copyright: Copyright © 2026 Open Cowork Team

directories:
  output: release
  buildResources: resources

npmRebuild: true
afterPack: ./scripts/after-pack.js
# Notarization must run on the *signed* bundle, before the DMG is built — an
# unsigned app is rejected outright and the stapled ticket is what lets
# Gatekeeper open it on another machine. Wired here: the hook existed but was
# never referenced, so every release shipped unnotarized.
afterSign: ./scripts/notarize.js
afterAllArtifactBuild: ./scripts/compress-dmg.js

files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
  # The run_code child spawns esbuild to transpile. It is a NATIVE binary, so it
  # must be present at runtime AND unpacked from the asar - an exec target inside
  # an archive is unreachable. Verified: esbuild refuses to be bundled (it finds
  # its binary by a relative path from its own source), so shipping it is the
  # only option.
  - node_modules/esbuild/**/*
  - node_modules/@esbuild/**/*
  - node_modules/@img/**/*
  - node_modules/better-sqlite3/**/*
  - node_modules/@anthropic-ai/sdk/**/*
  # Externalized from the Electron main bundle; keep the runtime package in installers.
  - node_modules/@google/genai/**/*
  - node_modules/@larksuiteoapi/**/*
  - node_modules/openai/**/*
  - node_modules/@modelcontextprotocol/**/*
  - node_modules/electron-updater/**/*
  - node_modules/chokidar/**/*
  - node_modules/archiver/**/*
  - node_modules/ngrok/**/*
  - node_modules/ws/**/*
  - node_modules/glob/**/*
  - node_modules/dotenv/**/*
  - node_modules/bufferutil/**/*
  - node_modules/utf-8-validate/**/*
  # Exclude non-essential files from node_modules to reduce bundle size
  - '!**/*.js.map'
  - '!**/*.mjs.map'
  - '!**/*.d.ts.map'
  - '!**/*.mts.map'
  - '!**/*.d.ts'
  - '!**/*.ts'
  - '!**/README.md'
  - '!**/CHANGELOG.md'
  - '!**/CHANGELOG'
  - '!**/LICENSE'
  - '!**/LICENSE.md'
  - '!**/.npmignore'
  - '!**/.eslintrc*'
  - '!**/tsconfig.json'

# MCP servers and platform-specific resources are declared in each platform's
# extraResources section below (win/mac/linux).

# Skills are extracted via extraResources (per-platform) to avoid asar symlink issues.
# Sharp native modules must also be unpacked for image processing.
# Note: MCP servers are bundled with esbuild (all deps inlined), so no need to unpack MCP SDK
asarUnpack:
  # esbuild ships as an extensionless native executable; it cannot be exec'd
  # from inside the asar.
  - node_modules/@esbuild/**/bin/esbuild
  - node_modules/@esbuild/**/bin/esbuild.exe
  - node_modules/@img/**/*.node
  - node_modules/@img/**/*.dll
  - node_modules/@img/**/*.dylib
  - node_modules/@img/**/*.so
  - node_modules/better-sqlite3/**/*.node
  - node_modules/bufferutil/**/*.node
  - node_modules/utf-8-validate/**/*.node

win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-${version}-win-${arch}.${ext}
  signAndEditExecutable: false
  extraResources:
    # The run_code child, OUTSIDE the asar on purpose: it is spawned as a plain
    # `node` process, and plain node cannot read an asar archive. Verified.
    - from: dist-electron/run-code-child
      to: run-code-child
    - from: .bundle-resources/mcp
      to: mcp
    - from: resources/node/win32-x64
      to: node
    - from: resources/node/win32-x64/node_modules/npm
      to: node/node_modules/npm
    - from: dist-wsl-agent
      to: wsl-agent
    - from: .claude/skills
      to: skills
    # Tray icons — setupTray() looks for these in the Resources root
    - from: resources/tray-icon.ico
      to: tray-icon.ico
    - from: resources/tray-icon.png
      to: tray-icon.png
    # Headless CLI launcher (scripts/deploy-local.sh links it on PATH)
    - from: bin/open-cowork.mjs
      to: bin/open-cowork.mjs

mac:
  icon: resources/icon.icns
  target:
    - target: dir
      arch:
        - arm64
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
  identity: auto
  hardenedRuntime: true
  gatekeeperAssess: true
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  extendInfo:
    LSApplicationCategoryType: public.app-category.developer-tools
    NSScreenCaptureUsageDescription: 'Open Cowork needs screen recording access for GUI automation.'
    NSAccessibilityUsageDescription: 'Open Cowork needs accessibility access for GUI automation.'
  extraResources:
    # The run_code child, OUTSIDE the asar on purpose: it is spawned as a plain
    # `node` process, and plain node cannot read an asar archive. Verified.
    - from: dist-electron/run-code-child
      to: run-code-child
    - from: .bundle-resources/mcp
      to: mcp
    - from: resources/node/darwin-${arch}
      to: node
    - from: resources/node/darwin-${arch}/lib/node_modules/npm
      to: node/lib/node_modules/npm
    # Bundled Python runtime + site-packages for GUI automation helpers (Pillow, pyobjc/Quartz)
    - from: resources/python/darwin-${arch}
      to: python
    # Bundled GUI helper tools (e.g. cliclick) to avoid relying on user-installed Homebrew tools
    - from: resources/tools/darwin-${arch}
      to: tools
    - from: dist-lima-agent
      to: lima-agent
    - from: .claude/skills
      to: skills
    # Tray icons — setupTray() looks for these in the Resources root
    - from: resources/tray-iconTemplate.png
      to: tray-iconTemplate.png
    - from: resources/tray-icon.png
      to: tray-icon.png
    # Headless CLI launcher (scripts/deploy-local.sh links it on PATH)
    - from: bin/open-cowork.mjs
      to: bin/open-cowork.mjs

linux:
  icon: resources/icon.png
  target:
    - target: AppImage
      arch:
        - x64
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
  extraResources:
    # The run_code child, OUTSIDE the asar on purpose: it is spawned as a plain
    # `node` process, and plain node cannot read an asar archive. Verified.
    - from: dist-electron/run-code-child
      to: run-code-child
    - from: .bundle-resources/mcp
      to: mcp
    - from: resources/node/linux-x64
      to: node
    - from: resources/node/linux-x64/lib/node_modules/npm
      to: node/lib/node_modules/npm
    - from: resources/python/linux-${arch}
      to: python
    - from: .claude/skills
      to: skills
    # Tray icons — setupTray() looks for these in the Resources root
    - from: resources/tray-icon.png
      to: tray-icon.png
    # Headless CLI launcher
    - from: bin/open-cowork.mjs
      to: bin/open-cowork.mjs

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  include: installer.nsh
  warningsAsErrors: false
  # Preserve user config/history by default; offer explicit cleanup tooling instead of destructive uninstall.
  deleteAppDataOnUninstall: false

dmg:
  # Explicit size to avoid dmgbuild "No space left on device" for large apps.
  # The temporary writable DMG is auto-shrunk after copying, so this doesn't
  # affect final DMG size. Our ULMO compression hook further reduces it.
  size: '3g'
  window:
    width: 600
    height: 440
  contents:
    - x: 150
      y: 220
      name: 'Open Cowork.app'
    - x: 450
      y: 220
      type: link
      path: /Applications
      name: 'Applications'

extraMetadata:
  main: dist-electron/main/index.js

publish:
  provider: github
  owner: OpenCoworkAI
  repo: open-cowork
